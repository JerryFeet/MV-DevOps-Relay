      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Guests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedGuests"
    post:
      operationId: createGuest
      tags: [guests]
      summary: Register a guest visit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestInput"
      responses:
        "201":
          description: Created guest
          content:
            application/json:
