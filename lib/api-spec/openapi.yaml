openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: HOA Management Platform API
servers:
  - url: /api
    description: Base API path
security:
  - bearerAuth: []
tags:
  - name: health
    description: Health operations
  - name: users
    description: User profile operations
  - name: announcements
    description: HOA announcements
  - name: facilities
    description: Bookable facilities
  - name: bookings
    description: Facility bookings
  - name: moveForms
    description: Move in/out forms
  - name: permits
    description: Renovation permits
  - name: documents
    description: Document library
  - name: residents
    description: Resident registration
  - name: guests
    description: Guest registration
  - name: vehicles
    description: Vehicle/plate registration
  - name: admin
    description: Admin dashboard
  - name: ai
    description: AI assistant and knowledge base
  - name: payments
    description: Payment history and receipts
  - name: wahaPasses
  - name: wahaGuestDayPasses
    description: Waha Pass — resident gate-access credential system
  - name: verify
    description: Gate QR code verification endpoints
  - name: unitVerifications
    description: Unit ownership and tenancy verification
  - name: storage
    description: Object storage upload and serving endpoints
  - name: portalHelp
    description: Resident portal help requests
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Users ──────────────────────────────────────────────────────────────────
  /users/me:
    get:
      operationId: getMyProfile
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
    put:
      operationId: updateMyProfile
      tags: [users]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/me/sync:
    post:
      operationId: syncUser
      tags: [users]
      summary: Sync/upsert user from Clerk after sign-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSync"
      responses:
        "200":
          description: Synced user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [owner, tenant, admin]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, pending, suspended]
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserAdminUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # ── Announcements ──────────────────────────────────────────────────────────
  /announcements:
    get:
      operationId: listAnnouncements
      tags: [announcements]
      summary: List announcements (public ones unauthenticated, all when auth'd)
      parameters:
        - name: isPublic
          in: query
          schema:
            type: boolean
        - name: pinned
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: List of announcements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAnnouncements"
    post:
      operationId: createAnnouncement
      tags: [announcements]
      summary: Create announcement (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"

  /announcements/templates:
    get:
      operationId: listAnnouncementTemplates
      tags: [announcements]
      summary: List fixed announcement templates (admin only)
      responses:
        "200":
          description: Template list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnnouncementTemplate"

  /announcements/ai-suggest:
    post:
      operationId: aiSuggestAnnouncement
      tags: [announcements]
      summary: AI optimize + translate announcement text (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiSuggestInput"
      responses:
        "200":
          description: Optimized and translated suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSuggestResult"

  /announcements/{id}:
    get:
      operationId: getAnnouncement
      tags: [announcements]
      summary: Get single announcement
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Announcement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
    patch:
      operationId: updateAnnouncement
      tags: [announcements]
      summary: Update announcement (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnouncementUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
    delete:
      operationId: deleteAnnouncement
      tags: [announcements]
      summary: Soft-delete announcement (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ── Facilities ─────────────────────────────────────────────────────────────
  /facilities:
    get:
      operationId: listFacilities
      tags: [facilities]
      summary: List all bookable facilities
      responses:
        "200":
          description: Facilities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Facility"
    post:
      operationId: createFacility
      tags: [facilities]
      summary: Create facility (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilityInput"
      responses:
        "201":
          description: Created facility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Facility"

  /facilities/{id}:
    get:
      operationId: getFacility
      tags: [facilities]
      summary: Get facility by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Facility
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Facility"
    patch:
      operationId: updateFacility
      tags: [facilities]
      summary: Update facility (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilityUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Facility"
    delete:
      operationId: deleteFacility
      tags: [facilities]
      summary: Delete facility (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /facilities/{id}/availability:
    get:
      operationId: getFacilityAvailability
      tags: [facilities]
      summary: Get booked slots for a facility on a given date
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Booked time slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeSlot"

  # ── Bookings ───────────────────────────────────────────────────────────────
  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List bookings (mine or all for admin)
      parameters:
        - name: facilityId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, cancelled, completed]
        - name: upcoming
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Bookings list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedBookings"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a new booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Created booking with payment intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingWithPayment"
        "403":
          description: Forbidden — active Waha Pass credential required (error code WAHA_PASS_REQUIRED) or insufficient permissions

  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get booking by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
    patch:
      operationId: updateBooking
      tags: [bookings]
      summary: Reschedule or update a booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingUpdate"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/{id}/cancel:
    post:
      operationId: cancelBooking
      tags: [bookings]
      summary: Cancel a booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Cancelled booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/{id}/confirm-payment:
    post:
      operationId: confirmBookingPayment
      tags: [bookings]
      summary: Confirm payment for a booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentConfirm"
      responses:
        "200":
          description: Payment confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  # ── Ownership Changes ───────────────────────────────────────────────────────
  /ownership-changes/proof-upload:
    post:
      operationId: requestOwnershipProofUploadUrl
      tags: [ownershipChanges]
      summary: Get a presigned URL for uploading a title deed proof document
      security: [{ BearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ext: { type: string, description: "File extension including leading dot, e.g. .pdf" }
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                type: object
                required: [uploadURL, objectPath]
                properties:
                  uploadURL:   { type: string }
                  objectPath:  { type: string }

  /ownership-changes:
    post:
      operationId: createOwnershipChange
      tags: [ownershipChanges]
      summary: Path A — current verified owner initiates change of ownership
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OwnershipChangeCreate" }
      responses:
        "201":
          description: Ownership change event created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnershipChangeEvent" }
    get:
      operationId: listOwnershipChanges
      tags: [ownershipChanges]
      summary: List ownership change events (admin only)
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: List of ownership change events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OwnershipChangeEvent" }

  /ownership-changes/claim:
    post:
      operationId: claimOwnership
      tags: [ownershipChanges]
      summary: Path B — new owner claims a unit occupied by an unresponsive owner
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OwnershipClaimCreate" }
      responses:
        "201":
          description: Ownership claim created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnershipChangeEvent" }

  /ownership-changes/{id}/finalize:
    patch:
      operationId: finalizeOwnershipChange
      tags: [ownershipChanges]
      summary: Admin finalizes a Path B transfer — promotes pre_approved claimant to verified_owner
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Finalization result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnershipChangeEvent" }

  /ownership-changes/{id}/cancel-pre-approval:
    patch:
      operationId: cancelOwnershipChangePreApproval
      tags: [ownershipChanges]
      summary: Admin cancels pre-approved slot or rejects a registered pre-approved claimant
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Event updated to rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnershipChangeEvent" }

  /ownership-changes/{id}/review:
    patch:
      operationId: reviewOwnershipChange
      tags: [ownershipChanges]
      summary: Admin approves or rejects an ownership change (triggers outgoing owner deletion on approve)
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:     { type: string, enum: [approved, rejected] }
                note:       { type: string }
      responses:
        "200":
          description: Review result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnershipChangeEvent" }

  # ── Move Forms (DEPRECATED — use /permits with type=move_in|move_out) ──────
  /move-forms:
    get:
      operationId: listMoveForms
      deprecated: true
      tags: [moveForms]
      summary: "[DEPRECATED] List legacy move forms — use GET /permits?type=move_in|move_out instead"
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [move_in, move_out]
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Move forms
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedMoveForms"
    post:
      operationId: createMoveForm
      deprecated: true
      tags: [moveForms]
      summary: "[DEPRECATED — returns 410 Gone] Use POST /permits with permitType=move_in|move_out"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MoveFormInput"
      responses:
        "201":
          description: Submitted form
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoveForm"

  /move-forms/{id}:
    get:
      operationId: getMoveForm
      deprecated: true
      tags: [moveForms]
      summary: "[DEPRECATED] Get legacy move form by ID"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Move form
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoveForm"
    patch:
      operationId: updateMoveFormStatus
      tags: [moveForms]
      summary: Update move form status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusUpdate"
      responses:
        "200":
          description: Updated form
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MoveForm"

  # ── Renovation Permits ─────────────────────────────────────────────────────
  /permits:
    get:
      operationId: listPermits
      tags: [permits]
      summary: List permits (mine or all for approvers)
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [move_in, move_out, renovation, additional_vehicle]
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, submitted, under_review, approved, approved_with_conditions, rejected, in_progress, completed, deposit_refunded, deposit_forfeited]
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Permits list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPermits"
    post:
      operationId: createPermit
      tags: [permits]
      summary: Submit a permit request (verified residents only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermitInput"
      responses:
        "201":
          description: Created permit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenovationPermit"

  /permits/{id}:
    get:
      operationId: getPermit
      tags: [permits]
      summary: Get permit by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Permit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenovationPermit"

  /permits/{id}/status:
    patch:
      operationId: updatePermitStatus
      tags: [permits]
      summary: Advance permit status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermitStatusUpdate"
      responses:
        "200":
          description: Updated permit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenovationPermit"

  # ── Documents ──────────────────────────────────────────────────────────────
  /document-folders:
    get:
      operationId: listDocumentFolders
      tags: [documents]
      summary: List document folders visible to the authenticated caller
      responses:
        "200":
          description: Visible folders, including empty folders for admins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentFolder"
    post:
      operationId: createDocumentFolder
      tags: [documents]
      summary: Create a document folder (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentFolderInput"
      responses:
        "201":
          description: Created folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentFolder"

  /document-folders/{id}:
    patch:
      operationId: updateDocumentFolder
      tags: [documents]
      summary: Rename, reorder, change defaults, or archive a folder (admin only)
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentFolderUpdate"
      responses:
        "200":
          description: Updated folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentFolder"
    delete:
      operationId: deleteDocumentFolder
      tags: [documents]
      summary: Delete an empty folder (admin only)
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      responses:
        "204":
          description: Deleted
        "409":
          description: Folder contains documents and must be archived instead

  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List current documents visible to the authenticated caller
      responses:
        "200":
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Create document metadata from an admin-uploaded private object (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /documents/{id}:
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get document by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Archive document (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Forbidden
        "404":
          description: Not found
    patch:
      operationId: updateDocument
      tags: [documents]
      summary: Update document metadata, folder, visibility, or download mode (admin only)
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentUpdate"
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /documents/{id}/replace:
    post:
      operationId: replaceDocument
      tags: [documents]
      summary: Replace a document by creating a new current record and archiving the prior record (admin only)
      parameters:
        - $ref: "#/components/parameters/DocumentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentReplacement"
      responses:
        "201":
          description: Replacement document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"

  /documents/{id}/download:
    get:
      operationId: downloadDocument
      tags: [documents]
      summary: Authenticated document view or download
      description: |
        The server streams a private object only after applying the document folder
        visibility floor and caller eligibility. Object storage URLs are never returned.
        View-only documents are served inline to non-admin callers; download-allowed
        documents may be saved. Admin may download every document.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: File content streamed from object storage
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          description: Forbidden – caller is not eligible for this document
        "404":
          description: Document not found or has no attached file

  # ── Residents ──────────────────────────────────────────────────────────────
  /residents:
    get:
      operationId: listResidents
      tags: [residents]
      summary: List residents (mine + family, or all for admin)
      parameters:
        - name: unitNumber
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [owner, tenant, family]
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Residents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedResidents"
    post:
      operationId: createResident
      tags: [residents]
      summary: Register a resident (owner registers self/family/tenants)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResidentInput"
      responses:
        "201":
          description: Created resident or a fifth-and-later resident review request
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Resident"
                  - $ref: "#/components/schemas/ExtraResidentRequest"

  /residents/{id}:
    get:
      operationId: getResident
      tags: [residents]
      summary: Get resident by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Resident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resident"
    patch:
      operationId: updateResident
      tags: [residents]
      summary: Update resident details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResidentUpdate"
      responses:
        "200":
          description: Updated resident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resident"
    delete:
      operationId: deleteResident
      tags: [residents]
      summary: Remove a resident
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        description: An optional audit reason. Administrators must provide a non-empty reason.
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResidentRemovalInput" }
      responses:
        "200":
          description: Secondary resident removal completed or was already completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResidentRemovalResponse" }

  /residents/extra-requests:
    get:
      operationId: listExtraResidentRequests
      tags: [residents]
      summary: List fifth-and-later resident requests (admin)
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ExtraResidentRequest" }

  /residents/extra-requests/{id}/decision:
    post:
      operationId: decideExtraResidentRequest
      tags: [residents]
      summary: Approve or refuse an extra resident request (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtraResidentDecision" }
      responses:
        "200":
          description: Decided request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtraResidentRequest" }

  # ── Storage ─────────────────────────────────────────────────────────────────
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
